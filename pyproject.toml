[project]
name = "aircraft-tracker-db"
version = "0.1.0"
description = "OpenSky aircraft data loader and PostgreSQL query manager"
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests>=2.32.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "black>=26.0.0,<27.0.0",
    "isort>=8.0.0,<9.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=2.0.0,<3.0.0",
    "types-requests>=2.32.0,<3.0.0",
    "types-psycopg2>=2.9.0,<3.0.0",
]

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 119

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov=main",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
